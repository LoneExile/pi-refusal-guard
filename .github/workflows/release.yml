name: Release

# Publishes to npm when a GitHub Release is published (tag the release with the
# version, e.g. v0.1.1, after bumping "version" in package.json). Can also be
# run manually.
#
# Tokenless: authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# Bootstrap, in this order — a trusted publisher is configured on a package's
# settings page, which does not exist until the package does, so OIDC cannot
# perform a package's very first publish (npm/cli#8544):
#   1. publish 0.1.0 by hand: `npm login && npm publish --access public`
#   2. npmjs.com → pi-refusal-guard → Settings → Trusted Publisher →
#      GitHub Actions, org "LoneExile", repo "pi-refusal-guard",
#      workflow "release.yml", allowed action "npm publish"
#   3. every release from 0.1.1 on runs through this workflow, tokenless
#
# Provenance is generated automatically for trusted-publisher releases.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
