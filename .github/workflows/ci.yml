name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: |
          set -euo pipefail
          npm pack --silent
          tar tzf pi-refusal-guard-*.tgz | tee /tmp/files.txt
          grep -qx 'package/extensions/refusal-guard.ts' /tmp/files.txt
          grep -qx 'package/package.json' /tmp/files.txt
          grep -qx 'package/README.md' /tmp/files.txt
          grep -qx 'package/LICENSE' /tmp/files.txt
          rm -f pi-refusal-guard-*.tgz
